<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="bootstrap.css">
    <script type="text/javascript" src="jquery.js"></script>
    <script type="text/javascript" src="popper.js"></script>
    <script type="text/javascript" src="bootstrap.js"></script>
    <link rel="stylesheet" type="text/css" href="Master.css">
    <script src="login.js"></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="row">
                <div class="col-5 col-sm-5 col-md-6 col-lg-6 col-xl-6">
                    <img src="img/logo.png" class="img-fluid mx-auto" height="70" width="170">
                </div>

                <div class="col-7 col-sm-7 col-md-6 col-lg-6 col-xl-6">
                    <form class="form-inline" style="margin-top: 35px; margin-left: 60px;">
                        <div class="input-group">
                            <input class="form-control mr-sm-2" type="text" placeholder="Search....">
                            <button class="btn btn-success" type="submit">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </header>
    <nav class="navbar navbar-expand-md bg-dark navbar-dark sticky-top">

        <div class="container-fluid">

            <!-- Toggle Button -->

            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Home.html" style="width:110px; text-align:center;">
                            HOME             
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="WeightLoss.html" style="width:160px; text-align:center;">
                            WEIGHT LOSS
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="WeightGain.html" style="width:160px; text-align:center;">
                            WEIGHT GAIN
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Workout.html" style="width:130px; text-align:center;">
                            WORKOUT
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Yoga.html" style="width:110px; text-align:center;">
                            YOGA
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Contact.html" style="width:110px; text-align:center;">
                            CONTACT
                        </a>
                    </li>
                    <li class="nav-item active" style="border-bottom: 3px solid #77b300; font-size: 17px;">

                        <a class="nav-link" href="Login.html" style="width:110px; text-align:center;">
                            LOGIN
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="login-box" 
                 style="border:3px solid #6ba300; border-radius:30px; padding:40px; margin-top:40px; background-color:#f5f5f5;">

                <h1 class="login-title text-center" 
                    style="font-size:45px; font-weight:bold; color:#001f3f;">
                    Login
                </h1>

                <p class="login-subtitle text-center" 
                   style="font-size:18px; margin-bottom:35px;">
                    Login to continue your Healthy Lifestyle Journey
                </p>

                <form onsubmit="return validateForm()">

                    <div class="form-group">

                        <label style="font-weight:bold;">Email Address:</label>

                        <input type="text" 
                               id="email" 
                               class="form-control" 
                               placeholder="Enter Email"
                               style="height:45px; border-radius:8px;">

                        <div id="emailError" class="error"></div>

                    </div>

                    <div class="form-group">

                        <label style="font-weight:bold;">Phone Number:</label>

                        <input type="text" 
                               id="phone" 
                               class="form-control" 
                               placeholder="Enter Phone Number"
                               style="height:45px; border-radius:8px;">

                        <div id="phoneError" class="error"></div>

                    </div>

                    <div class="form-group">

                        <label style="font-weight:bold;">Password:</label>

                        <input type="password" 
                               id="password" 
                               class="form-control" 
                               placeholder="Enter Password"
                               style="height:45px; border-radius:8px;">

                        <div id="passwordError" class="error"></div>

                    </div>

                    <button type="submit" 
                            class="btn btn-success btn-block"
                            style="background-color:#6ba300; border:none; font-size:22px; font-weight:bold; border-radius:10px; padding:10px;">
                        LOGIN
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
